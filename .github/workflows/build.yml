name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          mkdir -p $GITHUB_WORKSPACE/out
          find . -path "*/build/*.cs3" -exec cp {} $GITHUB_WORKSPACE/out/ \;
          cp build/plugins.json $GITHUB_WORKSPACE/out/

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/out
          git init
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -b builds
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
